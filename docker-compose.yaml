#      - /bin/sh
#      - -c
#      - |
#        until pg_isready -h postgres -U gatstogo -d gatstogo; do
#          sleep 1;
#        done;
#        for file in /migrations/*.up.sql; do
#          echo "Applying $$file";
#          psql -v ON_ERROR_STOP=1 -h postgres -U gatstogo -d gatstogo -f "$$file";
#        done
#    volumes:
#      - ./migrations:/migrations
#    networks:
#      - gatstogo-network

  # ======================
  # Redis
  # ======================
  redis:
    image: redis:7-alpine
    container_name: gatstogo-redis
    restart: unless-stopped
    profiles:
      - infra
    ports:
      - "6379:6379"          # Only for local access
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatstogo-network

  # ======================
  # Optional: Adminer (Database UI)
  # ======================
  adminer:
    image: adminer:latest
    container_name: gatstogo-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "8083:8080"          # Only for local access
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - gatstogo-network

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  go-build-cache:

networks:
  gatstogo-network:
    driver: bridge
