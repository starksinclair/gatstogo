services:
  # ======================
  # Go Application
  # ======================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gatstogo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      APP_DATABASE_URL: postgres://gatstogo:gatstogo_secret@postgres:5432/gatstogo?sslmode=disable
      ADMIN_DATABASE_URL: postgres://gatstogo:gatstogo_secret@postgres:5432/gatstogo?sslmode=disable
    command: ["air", "-c", ".air.toml"]
#    depends_on:
#      migrate:
#        condition: service_completed_successfully
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    networks:
      - gatstogo-network

  # ======================
  # PostgreSQL
  # ======================
  postgres:
    image: postgres:16-alpine
    container_name: gatstogo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gatstogo
      POSTGRES_PASSWORD: gatstogo_secret
      POSTGRES_DB: gatstogo
    ports:
      - "5435:5432"          # Only for local access (remove in production)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: run migrations automatically on first start
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatstogo -d gatstogo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gatstogo-network

  # ======================
  # Migrations
  # ======================
