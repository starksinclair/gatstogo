# gatstogo/gatstogo_secret is the Postgres bootstrap superuser (initdb's
# POSTGRES_USER) -- used only by the postgres service itself and by the
# migrate service to run DDL that the restricted gatstogo_app/gatstogo_admin
# roles are deliberately not allowed to run (schema 0001 REVOKEs CREATE on
# the public schema from them). It's shared between the two blocks below via
# this anchor so the credential can't silently drift out of sync between
# them. Rotate it for any real deployment -- it's still a hardcoded dev
# password, same as before this build-out.
x-postgres-superuser: &postgres-superuser
  PGUSER: gatstogo
  PGPASSWORD: gatstogo_secret

services:
  # ======================
  # Go Application
  # ======================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: gatstogo-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      # Tenant host shape: sunrise.localhost:8080 (see APP_BASE_DOMAIN).
      APP_BASE_DOMAIN: ${APP_BASE_DOMAIN:-localhost}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      # Normal tenant traffic: the restricted gatstogo_app role, subject to
      # Row Level Security. Its password is set by
      # migrations/0003_role_credentials.up.sql (run by the migrate service
      # below) from the same GATSTOGO_APP_ROLE_PASSWORD var, so these two
      # values are guaranteed to match at "docker compose up" time.
      APP_DATABASE_URL: postgres://gatstogo_app:${GATSTOGO_APP_ROLE_PASSWORD:?set GATSTOGO_APP_ROLE_PASSWORD in .env}@postgres:5432/gatstogo?sslmode=disable
      # Platform-level reads/writes: the gatstogo_admin role, which bypasses
      # Row Level Security. Same password-sync note as above.
      ADMIN_DATABASE_URL: postgres://gatstogo_admin:${GATSTOGO_ADMIN_ROLE_PASSWORD:?set GATSTOGO_ADMIN_ROLE_PASSWORD in .env}@postgres:5432/gatstogo?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # HMAC key for authenticated-session CSRF tokens (internal/csrf).
      # Generate one with: openssl rand -base64 32
      SESSION_HMAC_SECRET: "${SESSION_HMAC_SECRET:?set SESSION_HMAC_SECRET in .env}"
      # https://dashboard.paystack.com/#/settings/developers -- use a test
      # secret key for local development. Also verifies webhook signatures.
      PAYSTACK_SECRET_KEY: "${PAYSTACK_SECRET_KEY:?set PAYSTACK_SECRET_KEY in .env}"
      PAYSTACK_PUBLIC_KEY: ${PAYSTACK_PUBLIC_KEY:-}
      TICKET_NOTIFICATION_EMAIL: ${TICKET_NOTIFICATION_EMAIL:-gatstogofficial@gmail.com}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-logging}
    command: ["air", "-c", ".air.toml"]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    networks:
      - gatstogo-network

  # ======================
  # PostgreSQL
  # ======================
  postgres:
    image: postgres:16-alpine
    container_name: gatstogo-postgres
    restart: unless-stopped
    environment:
      # Must match the x-postgres-superuser anchor above (different key
      # names because the postgres image and the psql client expect
      # different env var names for the same credential).
      POSTGRES_USER: gatstogo
      POSTGRES_PASSWORD: gatstogo_secret
      POSTGRES_DB: gatstogo
    ports:
      - "5435:5432"          # Only for local access (remove in production)
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Optional: run migrations automatically on first start
      # - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gatstogo -d gatstogo"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gatstogo-network

  # ======================
  # Migrations
  # ======================
  # Same `gtg migrate` binary teammates use against Neon. Tracks versions
  # in schema_migrations, sets gatstogo_app/gatstogo_admin passwords from
  # GATSTOGO_*_ROLE_PASSWORD, and seeds demo logins (local compose only).
  # Re-running is a safe no-op. See docs/DATABASE.md.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: gatstogo-migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Bootstrap superuser (initdb), not gatstogo_app -- DDL + CREATE ROLE.
      MIGRATE_DATABASE_URL: postgres://gatstogo:gatstogo_secret@postgres:5432/gatstogo?sslmode=disable
      MIGRATIONS_DIR: /migrations
      GATSTOGO_APP_ROLE_PASSWORD: ${GATSTOGO_APP_ROLE_PASSWORD:?set GATSTOGO_APP_ROLE_PASSWORD in .env}
      GATSTOGO_ADMIN_ROLE_PASSWORD: ${GATSTOGO_ADMIN_ROLE_PASSWORD:?set GATSTOGO_ADMIN_ROLE_PASSWORD in .env}
      APP_ENV: development
      # Local demo stack: seed sunrise plant + known logins.
      SEED_DEV_DATA: "true"
    command: ["migrate", "--seed"]
    volumes:
      # Live-mount so editing SQL does not require rebuilding the migrate image.
      - ./migrations:/migrations:ro
    networks:
      - gatstogo-network

  # ======================
  # Redis (login sessions)
  # ======================
  # No longer profile-gated: login sessions (internal/session) depend on
  # this being up, so it's a required part of the default stack now, not an
  # optional extra.
  redis:
    image: redis:7-alpine
    container_name: gatstogo-redis
    restart: unless-stopped
    # AOF so login sessions survive Redis restarts (without this, every
    # `docker compose restart redis` mass-logs everyone out).
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"          # Only for local access
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - gatstogo-network

  # ======================
  # Optional: Adminer (Database UI)
  # ======================
  adminer:
    image: adminer:latest
    container_name: gatstogo-adminer
    restart: unless-stopped
    profiles:
      - tools
    ports:
      - "8083:8080"          # Only for local access
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - gatstogo-network

volumes:
  postgres_data:
  redis_data:
  go-mod-cache:
  go-build-cache:

networks:
  gatstogo-network:
    driver: bridge
